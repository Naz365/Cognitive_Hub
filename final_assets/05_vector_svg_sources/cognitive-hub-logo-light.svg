<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      .light-title-text {
        font-family: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #091326;
        letter-spacing: 1.2px;
      }
      .light-tagline-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 20.5px;
        font-weight: 600;
        fill: #1E293B;
        letter-spacing: 0.6px;
      }
    </style>

    <!-- Gradients for Light Mode -->
    <linearGradient id="lightFullGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="lightFullGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <filter id="lightSubtleDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Dual-Trace Circuit Logomark -->
  <g filter="url(#lightSubtleDrop)">
    <!-- Trace A -->
    <path d="M 38 132 V 56 C 38 40, 54 38, 66 50 L 94 78 C 102 86, 108 82, 108 72 V 64" fill="none" stroke="url(#lightFullGradA)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="38" cy="132" r="12" fill="#0284C7" />
    <circle cx="38" cy="132" r="4.5" fill="#E0F2FE" />
    <circle cx="108" cy="60" r="9.5" fill="#4F46E5" />
    <circle cx="108" cy="60" r="3.5" fill="#EEF2FF" />

    <!-- Trace B -->
    <path d="M 64 108 V 94 C 64 84, 72 80, 80 88 L 114 122 C 126 134, 140 130, 140 114 V 46" fill="none" stroke="url(#lightFullGradB)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="64" cy="112" r="9.5" fill="#0284C7" />
    <circle cx="64" cy="112" r="3.5" fill="#E0F2FE" />
    <circle cx="140" cy="44" r="12" fill="#6366F1" />
    <circle cx="140" cy="44" r="4.5" fill="#EEF2FF" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="176" y1="36" x2="176" y2="144" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

  <!-- Parallel Equal-Height Typography Block -->
  <g transform="translate(204, 0)">
    <text x="0" y="92" class="light-title-text">COGNITIVE HUB</text>
    <text x="2" y="130" class="light-tagline-text">
      O &amp; A Level ICT <tspan fill="#0284C7">•</tspan> Computer Science
    </text>
  </g>
</svg>
