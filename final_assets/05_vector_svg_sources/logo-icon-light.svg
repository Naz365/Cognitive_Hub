<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Crisp High-Contrast Gradient for Light Surfaces -->
    <linearGradient id="lightMarkGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="lightMarkGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth on white surfaces -->
    <filter id="lightSubtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Dual-Trace Circuit Logomark for Light Background -->
  <g transform="translate(11, 11)" filter="url(#lightSubtleShadow)">
    <!-- Trace A -->
    <path d="M 38 132 V 56 C 38 40, 54 38, 66 50 L 94 78 C 102 86, 108 82, 108 72 V 64" fill="none" stroke="url(#lightMarkGradA)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="38" cy="132" r="12" fill="#0284C7" />
    <circle cx="38" cy="132" r="4.5" fill="#E0F2FE" />
    <circle cx="108" cy="60" r="9.5" fill="#4F46E5" />
    <circle cx="108" cy="60" r="3.5" fill="#EEF2FF" />

    <!-- Trace B -->
    <path d="M 64 108 V 94 C 64 84, 72 80, 80 88 L 114 122 C 126 134, 140 130, 140 114 V 46" fill="none" stroke="url(#lightMarkGradB)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="64" cy="112" r="9.5" fill="#0284C7" />
    <circle cx="64" cy="112" r="3.5" fill="#E0F2FE" />
    <circle cx="140" cy="44" r="12" fill="#6366F1" />
    <circle cx="140" cy="44" r="4.5" fill="#EEF2FF" />
  </g>
</svg>
