<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      .title-text {
        font-family: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 1.2px;
      }
      .tagline-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 20.5px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 0.6px;
      }
    </style>

    <!-- Cyan to Violet Neon Gradients -->
    <linearGradient id="fullGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="fullGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Ambient Backlight Emission Aura Behind Icon -->
    <radialGradient id="iconBacklight" cx="89" cy="90" r="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.30" />
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonFullGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blurDeep" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blurMid" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blurCore" />
      <feMerge>
        <feMergeNode in="blurDeep" />
        <feMergeNode in="blurDeep" />
        <feMergeNode in="blurMid" />
        <feMergeNode in="blurCore" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Light Emission Aura -->
  <circle cx="89" cy="90" r="75" fill="url(#iconBacklight)" pointer-events="none" />

  <!-- Dual-Trace Circuit Logomark (with Backlight Glow) -->
  <g filter="url(#neonFullGlow)">
    <!-- Trace A -->
    <path d="M 38 132 V 56 C 38 40, 54 38, 66 50 L 94 78 C 102 86, 108 82, 108 72 V 64" fill="none" stroke="url(#fullGradA)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="38" cy="132" r="12" fill="#06B6D4" />
    <circle cx="38" cy="132" r="5" fill="#FFFFFF" />
    <circle cx="108" cy="60" r="9.5" fill="#6366F1" />
    <circle cx="108" cy="60" r="4" fill="#FFFFFF" />

    <!-- Trace B -->
    <path d="M 64 108 V 94 C 64 84, 72 80, 80 88 L 114 122 C 126 134, 140 130, 140 114 V 46" fill="none" stroke="url(#fullGradB)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="64" cy="112" r="9.5" fill="#06B6D4" />
    <circle cx="64" cy="112" r="4" fill="#FFFFFF" />
    <circle cx="140" cy="44" r="12" fill="#8B5CF6" />
    <circle cx="140" cy="44" r="5" fill="#FFFFFF" />
  </g>

  <!-- Vertical Divider Line (Matching exact icon vertical span y=36..144) -->
  <line x1="176" y1="36" x2="176" y2="144" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

  <!-- Parallel Equal-Height Typography Block -->
  <g transform="translate(204, 0)">
    <text x="0" y="92" class="title-text">COGNITIVE HUB</text>
    <text x="2" y="130" class="tagline-text">
      O &amp; A Level ICT <tspan fill="#22D3EE">•</tspan> Computer Science
    </text>
  </g>
</svg>
